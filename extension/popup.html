<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 280px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #030712;
      color: #f8fafc;
      padding: 16px;
      margin: 0;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }
    h3 {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      color: #06b6d4;
      letter-spacing: -0.02em;
    }
    .input-group {
      margin-bottom: 12px;
    }
    input {
      width: 100%;
      background: #0b0f19;
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #f8fafc;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12px;
      box-sizing: border-box;
      transition: border-color 0.15s;
    }
    input:focus {
      border-color: #06b6d4;
      outline: none;
    }
    button {
      width: 100%;
      background: linear-gradient(135deg, #06b6d4, #3b82f6);
      color: #030712;
      border: none;
      padding: 9px;
      font-weight: 700;
      font-size: 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button:hover {
      opacity: 0.9;
    }
    #status {
      font-size: 11px;
      color: #64748b;
      margin-top: 12px;
      text-align: center;
      font-weight: 500;
    }
    .status-ok { color: #10b981 !important; }
    .status-fail { color: #ef4444 !important; }
  </style>
</head>
<body>
  <div class="header">
    <svg viewBox="0 0 24 24" width="16" height="16" style="fill: #06b6d4;">
      <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1.68 12.87c.72-.51 1.25-1.29 1.45-2.22.25-1.16-.06-2.36-.83-3.23l1.45-1.45c1.4 1.58 1.96 3.75 1.51 5.86-.38 1.77-1.37 3.25-2.73 4.19l-.85-3.15zm-5.71-1.31c-.2-1.16.11-2.36.88-3.23l-1.45-1.45c-1.4 1.58-1.96 3.75-1.51 5.86.38 1.77 1.37 3.25 2.73 4.19l.85-3.15c-.71-.51-1.25-1.29-1.5-2.22zm4.03-5.26c-.72.51-1.25 1.29-1.45 2.22-.25 1.16.06 2.36.83 3.23l-1.45 1.45c-1.4-1.58-1.96-3.75-1.51-5.86.38-1.77 1.37-3.25 2.73-4.19l.85 3.15z"/>
    </svg>
    <h3>FetchDesk Downloader</h3>
  </div>
  <div class="input-group">
    <input type="text" id="url" placeholder="Paste download URL or YouTube link..." />
  </div>
  <button id="send">Send to Download Queue</button>
  <div id="status">Checking FetchDesk connection...</div>
  <script src="popup.js"></script>
</body>
</html>
