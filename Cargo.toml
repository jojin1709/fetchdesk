[package]
name = "fetchdesk"
version = "0.2.0"
edition = "2021"
authors = ["JOJIN JOHN"]
description = "Terminal-based multi-connection download manager"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", default-features = false, features = ["stream", "rustls-tls-native-roots", "cookies"] }
futures-util = "0.3"
indicatif = "0.17"
anyhow = "1"
colored = "2"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
zip = "0.6"
uuid = { version = "1", features = ["v4"] }

[profile.release]
opt-level = 3
lto = true
